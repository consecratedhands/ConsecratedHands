name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Audit routes and assets
        run: corepack yarn audit:site

      - name: Audit dependency security
        run: corepack yarn audit --level high

      - name: Test mobile navigation
        run: CI=true corepack yarn test --watchAll=false

      - name: Build production frontend
        run: corepack yarn build
        env:
          REACT_APP_SITE_URL: https://consecratedhands.com
          REACT_APP_BACKEND_URL: https://api.example.invalid

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python
        run: python -m compileall -q backend

      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Import FastAPI application
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_check
          SITE_URL: https://consecratedhands.com
          CORS_ORIGINS: https://consecratedhands.com
        run: python -c "from backend.server import app; assert app is not None"

      - name: Run backend tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_check
          SITE_URL: https://consecratedhands.com
          CORS_ORIGINS: https://consecratedhands.com
        run: python -m pytest -q backend/tests/test_server.py
