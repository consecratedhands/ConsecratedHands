name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production frontend
        run: yarn build
        env:
          REACT_APP_SITE_URL: https://consecratedhands.com
          REACT_APP_BACKEND_URL: https://api.example.invalid

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python
        run: python -m compileall -q backend

      - name: Install backend runtime dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1
          python-dotenv>=1.0.1
          pymongo==4.6.3
          motor==3.3.1
          pydantic>=2.6.4
          email-validator>=2.2.0
          stripe>=7.0.0
          httpx>=0.27.0

      - name: Import FastAPI application
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_check
          SITE_URL: https://consecratedhands.com
          CORS_ORIGINS: https://consecratedhands.com
        run: python -c "from backend.server import app; assert app is not None"
